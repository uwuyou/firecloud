<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>火烧云预报 - 卫星云图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:#0f172a}
#map{width:100%;height:100%}

/* 底部控制栏 */
.bottom-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:1000;
  background:rgba(15,23,42,0.94);backdrop-filter:blur(16px);
  border-top:1px solid rgba(255,255,255,0.1);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:8px;
}
.bar-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar-label{font-size:11px;color:#94a3b8;white-space:nowrap}

/* 状态标签 */
.status-tag{
  font-size:11px;padding:4px 10px;border-radius:12px;font-weight:600;
  display:inline-flex;align-items:center;gap:4px;
}
.status-tag.live{background:rgba(34,197,94,0.15);color:#4ade80;border:1px solid rgba(34,197,94,0.3)}
.status-tag.no{background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.3)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

/* 按钮 */
.btn{
  padding:8px 14px;font-size:12px;font-weight:600;border-radius:8px;
  border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);
  color:#cbd5e1;cursor:pointer;transition:all 0.2s;white-space:nowrap;
  display:inline-flex;align-items:center;gap:4px;
}
.btn:active{transform:scale(0.96)}
.btn.active{background:rgba(251,146,60,0.2);border-color:#fb923c;color:#fb923c}
.btn-morning{color:#fbbf24;border-color:rgba(251,191,36,0.3)}
.btn-morning.active{background:rgba(251,191,36,0.2);border-color:#fbbf24}
.btn-evening{color:#f87171;border-color:rgba(248,113,113,0.3)}
.btn-evening.active{background:rgba(248,113,113,0.2);border-color:#f87171}

/* 信息面板 */
.info-panel{
  position:fixed;top:12px;right:12px;z-index:1000;max-width:260px;
  background:rgba(15,23,42,0.9);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.1);border-radius:12px;
  padding:14px;color:#e2e8f0;font-size:12px;
  box-shadow:0 4px 20px rgba(0,0,0,0.4);
  display:none;
}
.info-panel.show{display:block}
.info-panel .title{font-size:14px;font-weight:700;color:#fb923c;margin-bottom:8px}
.info-panel .row{display:flex;justify-content:space-between;padding:3px 0;color:#94a3b8}
.info-panel .row .val{color:#f1f5f9;font-weight:500}
.info-panel .formula{font-size:10px;color:#64748b;margin-top:6px;line-height:1.5}

/* 图例 */
.legend-bar{
  display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:8px;
}
.legend-bar .morning{flex:1;background:linear-gradient(to right,rgba(255,180,80,0.3),rgba(255,100,40,0.8))}
.legend-bar .evening{flex:1;background:linear-gradient(to left,rgba(180,60,120,0.3),rgba(200,30,30,0.8))}
.legend-labels{display:flex;justify-content:space-between;font-size:10px;color:#64748b;margin-top:2px}

/* 移动端适配 */
@media (max-width:480px){
  .info-panel{top:8px;right:8px;max-width:220px;padding:10px;font-size:11px}
  .btn{padding:6px 10px;font-size:11px}
  .bar-row{gap:4px}
}

/* Leaflet 控件 */
.leaflet-control-zoom{border:1px solid rgba(255,255,255,0.15)!important}
.leaflet-control-zoom a{background:rgba(15,23,42,0.85)!important;color:#e2e8f0!important;border-color:rgba(255,255,255,0.1)!important}

/* 加载指示器 */
.loading-overlay{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2000;
  background:rgba(15,23,42,0.9);padding:16px 24px;border-radius:12px;
  color:#fbbf24;font-size:14px;display:none;align-items:center;gap:8px;
}
.loading-overlay.show{display:flex}
.spinner{width:18px;height:18px;border:2px solid rgba(251,191,36,0.3);border-top-color:#fbbf24;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="map"></div>

<div class="info-panel" id="infoPanel">
  <div class="title" id="infoTitle">朝霞 / 晚霞 分析</div>
  <div class="row"><span>UTC时间</span><span class="val" id="infoUtc">--</span></div>
  <div class="row"><span>北京时间</span><span class="val" id="infoBj">--</span></div>
  <div class="row"><span>🌅 朝霞</span><span class="val" style="color:#fbbf24" id="infoMorning">--</span></div>
  <div class="row"><span>🌇 晚霞</span><span class="val" style="color:#f87171" id="infoEvening">--</span></div>
  <div class="row"><span>太阳赤纬</span><span class="val" id="infoDecl">--</span></div>
  <div class="formula">
    D ≈ √(2·R·h), R=6371km<br>
    T ≈ 2D/v_sunset<br>
    v ≈ 18~21 km/min
  </div>
  <div class="legend-bar"><div class="morning"></div><div class="evening"></div></div>
  <div class="legend-labels"><span>🌅 朝霞 (日出前)</span><span>🌇 晚霞 (日落后)</span></div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <span>计算火烧云...</span>
</div>

<div class="bottom-bar">
  <div class="bar-row" style="justify-content:space-between">
    <span class="status-tag live" id="statusTag"><span class="dot"></span><span id="statusText">实时</span></span>
    <span style="font-size:11px;color:#64748b" id="timeDisplay">--</span>
  </div>
  <div class="bar-row">
    <span class="bar-label">模拟时间:</span>
    <button class="btn btn-morning active" onclick="simCalc(20.8)" title="UTC 20:48 = 北京 04:48">04:48 朝霞</button>
    <button class="btn btn-morning" onclick="simCalc(21.0)" title="UTC 21:00 = 北京 05:00">05:00 朝霞</button>
    <button class="btn btn-evening" onclick="simCalc(11.0)" title="UTC 11:00 = 北京 19:00">19:00 晚霞</button>
    <button class="btn btn-evening" onclick="simCalc(11.5)" title="UTC 11:30 = 北京 19:30">19:30 晚霞</button>
    <button class="btn" onclick="simCalc(-1)" title="使用当前实际时间">现在</button>
  </div>
</div>

<script>
// ===== 火烧云计算引擎 (JavaScript) =====
const R_EARTH = 6371.0;
const AEROSOL_EQ_GROUND = 0.5;
const GRID_STEP = 0.5;
const LAT_MIN = 5, LAT_MAX = 55, LON_MIN = 70, LON_MAX = 145;

function solarDeclination(doy) {
  return 23.45 * Math.sin(Math.PI / 180 * (360 / 365 * (doy - 81)));
}

function solarNoonUtc(lon) {
  return 12.0 - lon / 15.0;
}

function sunsetHourAngle(lat, dec) {
  const latR = lat * Math.PI / 180;
  const decR = dec * Math.PI / 180;
  const cosHA = (-Math.sin(-0.833 * Math.PI / 180) - Math.sin(latR) * Math.sin(decR)) /
                (Math.cos(latR) * Math.cos(decR));
  if (cosHA < -1) return 0;
  if (cosHA > 1) return Math.PI;
  return Math.acos(cosHA);
}

function sunsetTimeUtc(lat, lon, dec) {
  const ha = sunsetHourAngle(lat, dec);
  return solarNoonUtc(lon) + ha * 180 / Math.PI / 15.0;
}

function sunriseTimeUtc(lat, lon, dec) {
  const ha = sunsetHourAngle(lat, dec);
  return solarNoonUtc(lon) - ha * 180 / Math.PI / 15.0;
}

function sunsetLineSpeed(lat, month) {
  const latFactor = Math.max(0.3, Math.cos(lat * Math.PI / 180));
  const monthAngle = Math.PI / 180 * (360 / 365 * (month * 30 - 81));
  const seasonal = 0.8 + 0.2 * Math.cos(monthAngle);
  return 21.0 * latFactor * seasonal;
}

function glowPenetration(cloudBaseKm) {
  return Math.sqrt(2 * R_EARTH * cloudBaseKm);
}

function effectiveCloudBase(h) {
  return Math.max(0.1, h - AEROSOL_EQ_GROUND);
}

function solarAzimuth(lat, dec, hourUtc, lon) {
  const latR = lat * Math.PI / 180;
  const decR = dec * Math.PI / 180;
  const noon = solarNoonUtc(lon);
  const haDeg = (hourUtc - noon) * 15.0;
  const haR = haDeg * Math.PI / 180;
  const sinAlt = Math.sin(latR) * Math.sin(decR) + Math.cos(latR) * Math.cos(decR) * Math.cos(haR);
  const altR = Math.asin(Math.max(-1, Math.min(1, sinAlt)));
  if (Math.cos(altR) < 1e-10) return 180;
  let cosAz = (Math.sin(decR) - Math.sin(latR) * Math.sin(altR)) / (Math.cos(latR) * Math.cos(altR));
  cosAz = Math.max(-1, Math.min(1, cosAz));
  let az = Math.acos(cosAz) * 180 / Math.PI;
  if (haR > 0) az = 360 - az;
  return az;
}

// 估算云底高度 (基于纬度/季节的粗略估算)
function estimateCloudBase(lat, month) {
  // 中纬度地区云底通常在 1-8km
  // 低纬度地区云底较高
  const absLat = Math.abs(lat);
  if (absLat < 20) return 2.0 + Math.random() * 4.0;   // 热带 2-6km
  if (absLat < 35) return 1.5 + Math.random() * 5.0;   // 亚热带 1.5-6.5km
  if (absLat < 45) return 1.0 + Math.random() * 4.5;   // 温带 1-5.5km
  return 0.8 + Math.random() * 3.5;                      // 寒温带 0.8-4.3km
}

// 基于经纬度的确定性伪随机云底高度
function gridCloudBase(lat, lon) {
  // 使用经纬度作为种子，产生稳定的云底高度
  const seed = Math.sin(lat * 127.1 + lon * 311.7) * 43758.5453;
  const rand = seed - Math.floor(seed);
  const absLat = Math.abs(lat);
  let baseMin, baseMax;
  if (absLat < 20) { baseMin = 1.5; baseMax = 5.5; }
  else if (absLat < 35) { baseMin = 1.0; baseMax = 5.0; }
  else if (absLat < 45) { baseMin = 0.8; baseMax = 4.5; }
  else { baseMin = 0.5; baseMax = 3.5; }
  return baseMin + rand * (baseMax - baseMin);
}

function computeFireCloud(utcHour, now) {
  const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
  const dec = solarDeclination(dayOfYear);
  const month = now.getMonth() + 1;

  const lats = [];
  const lons = [];
  for (let lat = LAT_MIN; lat <= LAT_MAX; lat += GRID_STEP) lats.push(lat);
  for (let lon = LON_MIN; lon <= LON_MAX; lon += GRID_STEP) lons.push(lon);

  const features = [];
  let morningCount = 0, eveningCount = 0;

  for (let i = 0; i < lats.length; i++) {
    for (let j = 0; j < lons.length; j++) {
      const lat = lats[i];
      const lon = lons[j];

      const h = gridCloudBase(lat, lon);
      if (h < 0.5) continue;

      const hEff = effectiveCloudBase(h);
      const D = glowPenetration(hEff);

      let ssUtc = sunsetTimeUtc(lat, lon, dec);
      let srUtc = sunriseTimeUtc(lat, lon, dec);

      // 标准化时间
      while (ssUtc < 0) ssUtc += 24;
      while (srUtc < 0) srUtc += 24;
      const effHour = ((utcHour % 24) + 24) % 24;
      while (srUtc < effHour - 12) srUtc += 24;
      while (ssUtc < effHour - 12) ssUtc += 24;

      const vSS = sunsetLineSpeed(lat, month);
      const fireDuration = 2.0 * D / vSS;

      const dtSS = (effHour - ssUtc) * 60;
      const dtSR = (effHour - srUtc) * 60;

      let isMorning = false, isEvening = false, score = 0, sunAz = 0;

      // 朝霞: 日出前
      if (dtSR < 0) {
        const dtBefore = Math.abs(dtSR);
        if (dtBefore <= fireDuration + 5) {
          isMorning = true;
          const progress = dtBefore / fireDuration;
          score = Math.max(0, 1.0 - Math.abs(progress - 0.3) * 1.5);
          sunAz = solarAzimuth(lat, dec, srUtc, lon);
        }
      }

      // 晚霞: 日落后
      if (!isMorning && dtSS >= 0) {
        if (dtSS <= fireDuration + 5) {
          isEvening = true;
          const progress = dtSS / fireDuration;
          score = Math.max(0, 1.0 - Math.abs(progress - 0.3) * 1.5);
          sunAz = solarAzimuth(lat, dec, ssUtc, lon);
        }
      }

      if (!isMorning && !isEvening) continue;

      if (isMorning) morningCount++;
      else eveningCount++;

      const half = GRID_STEP / 2;
      features.push({
        type: 'Feature',
        properties: {
          cloud_base_km: Math.round(h * 10) / 10,
          eff_cloud_base_km: Math.round(hEff * 10) / 10,
          penetration_km: Math.round(D * 10) / 10,
          fire_duration_min: Math.round(fireDuration * 10) / 10,
          is_morning: isMorning,
          is_evening: isEvening,
          score: Math.round(score * 100) / 100,
          sun_azimuth: Math.round(sunAz * 10) / 10,
        },
        geometry: {
          type: 'Polygon',
          coordinates: [[
            [lon - half, lat - half],
            [lon + half, lat - half],
            [lon + half, lat + half],
            [lon - half, lat + half],
            [lon - half, lat - half],
          ]]
        }
      });
    }
  }

  const simH = Math.floor(((effHour % 24) + 24) % 24);
  const simM = Math.floor((effHour - Math.floor(effHour)) * 60);
  const bjH = (simH + 8) % 24;

  return {
    type: 'FeatureCollection',
    features: features.slice(0, 8000),
    meta: {
      current_utc: `${String(simH).padStart(2,'0')}:${String(simM).padStart(2,'0')} UTC`,
      current_beijing: `${String(bjH).padStart(2,'0')}:${String(simM).padStart(2,'0')}`,
      day_of_year: dayOfYear,
      declination: Math.round(dec * 100) / 100,
      has_fire_cloud: features.length > 0,
      feature_count: features.length,
      morning_count: morningCount,
      evening_count: eveningCount,
      simulated: utcHour >= 0,
    }
  };
}

// ===== 地图初始化 =====
const map = L.map('map', {
  center: [30, 110],
  zoom: 5,
  zoomControl: true,
  attributionControl: false,
  maxBounds: [[-10, 50], [60, 180]],
  minZoom: 3,
  maxZoom: 12,
});

// ESRI 卫星底图 (免费, 无需 API Key)
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 18,
}).addTo(map);

let fireCloudLayer = null;

// 火烧云颜色
function getFireCloudColor(props) {
  const score = props.score || 0;
  if (props.is_morning) {
    // 朝霞: 金色到橙色
    const r = Math.round(255);
    const g = Math.round(180 - score * 80);
    const b = Math.round(60 - score * 40);
    const a = (0.2 + score * 0.5).toFixed(2);
    return `rgba(${r},${g},${b},${a})`;
  } else {
    // 晚霞: 红色到玫红
    const r = Math.round(200 + score * 55);
    const g = Math.round(50 - score * 20);
    const b = Math.round(60 - score * 30);
    const a = (0.2 + score * 0.5).toFixed(2);
    return `rgba(${r},${g},${b},${a})`;
  }
}

function styleFireCloud(feature) {
  return {
    fillColor: getFireCloudColor(feature.properties),
    color: feature.properties.is_morning ? '#fbbf24' : '#f87171',
    weight: 0.5,
    opacity: 0.6,
    fillOpacity: 1,
  };
}

function showFireCloud(geojson) {
  if (fireCloudLayer) map.removeLayer(fireCloudLayer);

  fireCloudLayer = L.geoJSON(geojson, {
    style: styleFireCloud,
  }).addTo(map);

  // 更新信息面板
  const meta = geojson.meta || {};
  document.getElementById('infoUtc').textContent = meta.current_utc || '--';
  document.getElementById('infoBj').textContent = meta.current_beijing || '--';
  document.getElementById('infoMorning').textContent = (meta.morning_count || 0) + ' 个格点';
  document.getElementById('infoEvening').textContent = (meta.evening_count || 0) + ' 个格点';
  document.getElementById('infoDecl').textContent = (meta.declination || '--') + '°';

  const panel = document.getElementById('infoPanel');
  if (meta.has_fire_cloud) {
    panel.classList.add('show');
    document.getElementById('infoTitle').textContent = '🌅 朝霞 / 晚霞 分析';
    document.getElementById('statusText').textContent = '有火烧云';
    document.getElementById('statusTag').className = 'status-tag live';
  } else {
    panel.classList.add('show');
    document.getElementById('infoTitle').textContent = '当前无火烧云';
    document.getElementById('statusText').textContent = '无火烧云';
    document.getElementById('statusTag').className = 'status-tag no';
  }
}

function updateTimeDisplay() {
  const now = new Date();
  const utc = now.toISOString().replace('T',' ').slice(0,19) + ' UTC';
  const bj = new Date(now.getTime() + 8*3600000).toISOString().replace('T',' ').slice(0,16);
  document.getElementById('timeDisplay').textContent = '北京 ' + bj;
}

// ===== 计算与交互 =====
let currentSimHour = 20.8; // 默认模拟朝霞时段

function simCalc(hour) {
  currentSimHour = hour;

  // 更新按钮状态
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  if (hour === 20.8) document.querySelector('.btn-morning').classList.add('active');
  else if (hour === 21.0) document.querySelectorAll('.btn-morning')[1].classList.add('active');
  else if (hour === 11.0) document.querySelector('.btn-evening').classList.add('active');
  else if (hour === 11.5) document.querySelectorAll('.btn-evening')[1].classList.add('active');
  else document.querySelectorAll('.btn')[4].classList.add('active');

  const overlay = document.getElementById('loadingOverlay');
  overlay.classList.add('show');

  // 使用 setTimeout 让 loading 动画先显示
  setTimeout(() => {
    const now = new Date();
    let utcHour;
    if (hour < 0) {
      utcHour = now.getUTCHours() + now.getUTCMinutes() / 60 + now.getUTCSeconds() / 3600;
    } else {
      utcHour = hour;
    }

    const geojson = computeFireCloud(utcHour, now);
    showFireCloud(geojson);
    overlay.classList.remove('show');
  }, 100);
}

// 初始加载
setTimeout(() => {
  simCalc(currentSimHour);
  updateTimeDisplay();
  setInterval(updateTimeDisplay, 30000);
}, 500);
</script>
</body>
</html>
