<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>卫星云图 - 火烧云预报</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  #map { width: 100%; height: 100%; }

  .control-panel {
    position: absolute; top: 16px; right: 16px; z-index: 1000;
    background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 14px;
    padding: 16px; color: #e2e8f0; min-width: 270px; max-width: 320px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    max-height: calc(100vh - 32px); overflow-y: auto;
  }
  @media (max-width: 480px) {
    .control-panel { top: 8px; right: 8px; min-width: 240px; max-width: 280px; padding: 12px; font-size: 11px; }
  }

  .panel-title {
    font-size: 16px; font-weight: 700; color: #f8fafc;
    margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
  }
  .panel-title::before {
    content: ''; display: inline-block; width: 4px; height: 18px;
    background: linear-gradient(180deg, #ef4444, #f97316); border-radius: 2px;
  }

  .status-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; padding: 3px 8px; border-radius: 10px; font-weight: 500;
  }
  .status-badge.live { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
  .status-badge.no { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
  .status-badge.loading { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .info-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 0; font-size: 11px; border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .info-label { color: #94a3b8; }
  .info-value { color: #f1f5f9; font-weight: 500; font-size: 11px; }

  .section-label { font-size: 11px; color: #94a3b8; margin-bottom: 6px; }

  /* 卫星云图叠加 */
  .satellite-section {
    margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1);
  }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
  .toggle-label { font-size: 12px; color: #cbd5e1; }

  .toggle-switch { position: relative; width: 40px; height: 22px; cursor: pointer; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute; inset: 0; background: #334155; border-radius: 11px; transition: 0.3s;
  }
  .toggle-slider::before {
    content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: 0.3s;
  }
  .toggle-switch input:checked + .toggle-slider { background: linear-gradient(135deg, #3b82f6, #6366f1); }
  .toggle-switch input:checked + .toggle-slider::before { transform: translateX(18px); }

  .opacity-section { margin-top: 6px; }
  .opacity-section label { font-size: 10px; color: #94a3b8; display: block; margin-bottom: 3px; }
  .opacity-slider {
    width: 100%; -webkit-appearance: none; height: 4px; border-radius: 2px;
    background: #334155; outline: none;
  }
  .opacity-slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: #3b82f6; cursor: pointer; box-shadow: 0 0 6px rgba(59,130,246,0.5);
  }

  /* 产品 */
  .product-grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px;
  }
  .product-btn {
    padding: 6px 3px; font-size: 10px; font-weight: 500; text-align: center;
    border: 1px solid rgba(255,255,255,0.12); border-radius: 8px;
    background: transparent; color: #94a3b8; cursor: pointer; transition: all 0.25s;
    display: flex; flex-direction: column; align-items: center; gap: 2px; opacity: 0.6;
    position: relative; overflow: hidden;
  }
  .product-btn.active {
    background: rgba(99,102,241,0.2); border-color: #6366f1; color: #a5b4fc; opacity: 1;
  }
  .product-btn.loading::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, #6366f1, transparent);
    animation: loading-bar 1.2s infinite;
  }
  @keyframes loading-bar { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }
  .product-icon {
    width: 24px; height: 24px; border-radius: 6px; display: flex;
    align-items: center; justify-content: center; font-size: 12px;
  }

  /* 火烧云 */
  .fire-cloud-section {
    margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1);
  }
  .sim-btns { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .sim-btn {
    flex: none; padding: 5px 8px; font-size: 10px; font-weight: 500;
    border: 1px solid rgba(255,255,255,0.15); border-radius: 6px;
    background: transparent; color: #94a3b8; cursor: pointer; transition: all 0.2s; text-align: center;
  }
  .sim-btn:active { transform: scale(0.96); }
  .sim-btn.morning { color: #fbbf24; border-color: rgba(251,191,36,0.3); }
  .sim-btn.morning.active { background: rgba(251,191,36,0.2); border-color: #fbbf24; }
  .sim-btn.evening { color: #f87171; border-color: rgba(248,113,113,0.3); }
  .sim-btn.evening.active { background: rgba(248,113,113,0.2); border-color: #f87171; }
  .sim-btn.now { color: #60a5fa; border-color: rgba(96,165,250,0.3); }
  .sim-btn.now.active { background: rgba(96,165,250,0.2); border-color: #60a5fa; }

  .calc-btn {
    width: 100%; margin-top: 8px; padding: 8px; font-size: 12px; font-weight: 500;
    border: 1px solid rgba(255,69,0,0.3); border-radius: 8px;
    background: rgba(255,69,0,0.1); color: #fb923c; cursor: pointer;
    transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .calc-btn:active { transform: scale(0.97); }
  .calc-btn:disabled { opacity: 0.5; cursor: wait; }

  .fire-cloud-info {
    margin-top: 8px; padding: 8px; border-radius: 8px;
    background: rgba(255,69,0,0.08); border: 1px solid rgba(255,69,0,0.2);
    font-size: 11px; color: #fbbf24; line-height: 1.6;
    display: none;
  }
  .fire-cloud-info.visible { display: block; }
  .fire-cloud-info .info-item { display: flex; justify-content: space-between; padding: 2px 0; }
  .fire-cloud-info .info-item span:last-child { color: #f8fafc; font-weight: 500; }

  .fire-cloud-legend { margin-top: 10px; display: none; }
  .fire-cloud-legend .legend-title { font-size: 11px; color: #94a3b8; margin-bottom: 6px; }
  .fire-cloud-bar {
    height: 12px; border-radius: 3px; margin-bottom: 3px;
    display: flex; overflow: hidden;
  }
  .fire-cloud-bar .bar-morning {
    flex: 1;
    background: linear-gradient(to right, rgba(255,180,80,0.2) 0%, rgba(255,140,60,0.5) 40%, rgba(255,100,40,0.7) 100%);
  }
  .fire-cloud-bar .bar-evening {
    flex: 1;
    background: linear-gradient(to left, rgba(180,60,120,0.2) 0%, rgba(220,50,80,0.5) 40%, rgba(200,30,30,0.7) 100%);
  }
  .fire-cloud-labels { display: flex; justify-content: space-between; font-size: 9px; color: #64748b; }
  .fire-cloud-labels .morning-label { color: #fbbf24; }
  .fire-cloud-labels .evening-label { color: #f87171; }

  .basemap-section { margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); }
  .basemap-btns { display: flex; gap: 5px; }
  .basemap-btn {
    flex: 1; padding: 5px 3px; font-size: 10px;
    border: 1px solid rgba(255,255,255,0.15); border-radius: 6px;
    background: transparent; color: #94a3b8; cursor: pointer; transition: all 0.2s; text-align: center;
  }
  .basemap-btn.active { background: rgba(59,130,246,0.2); border-color: #3b82f6; color: #60a5fa; }

  .coord-display {
    position: absolute; bottom: 12px; left: 12px; z-index: 1000;
    background: rgba(15,23,42,0.85); backdrop-filter: blur(8px);
    padding: 5px 10px; border-radius: 8px; font-size: 11px; color: #94a3b8;
    font-family: 'Consolas', 'Monaco', monospace;
  }

  .leaflet-control-zoom { border: 1px solid rgba(255,255,255,0.15) !important; }
  .leaflet-control-zoom a { background: rgba(15,23,42,0.85) !important; color: #e2e8f0 !important; border-color: rgba(255,255,255,0.1) !important; }

  .toast {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 2000;
    background: rgba(15,23,42,0.95); backdrop-filter: blur(12px);
    border: 1px solid rgba(251,191,36,0.3); border-radius: 10px;
    padding: 8px 16px; color: #fbbf24; font-size: 12px;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  .loading-overlay {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 2000;
    background: rgba(15,23,42,0.9); padding: 14px 20px; border-radius: 12px;
    color: #fbbf24; font-size: 13px; display: none; align-items: center; gap: 8px;
  }
  .loading-overlay.show { display: flex; }
  .spinner { width: 16px; height: 16px; border: 2px solid rgba(251,191,36,0.3); border-top-color: #fbbf24; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .leaflet-popup-content-wrapper { background: rgba(15,23,42,0.95); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; }
  .leaflet-popup-tip { background: rgba(15,23,42,0.95); }
  .leaflet-popup-close-button { color: #94a3b8 !important; }

  /* 优化卫星图层渲染质量 */
  .gk2a-overlay img { image-rendering: auto; }
  .leaflet-tile { image-rendering: auto; }

  /* 卫星状态指示 */
  .sat-status { font-size: 10px; padding: 2px 6px; border-radius: 6px; display: inline-block; }
  .sat-status.online { background: rgba(34,197,94,0.15); color: #4ade80; }
  .sat-status.offline { background: rgba(239,68,68,0.15); color: #f87171; }
</style>
</head>
<body>

<div id="map"></div>

<div class="control-panel">
  <div class="panel-title">
    卫星云图
    <span class="status-badge live" id="statusBadge">
      <span class="status-dot"></span>
      <span id="statusText">在线</span>
    </span>
  </div>

  <div class="info-row">
    <span class="info-label">卫星</span>
    <span class="info-value">GK2A ELA (128.2E) / VIIRS</span>
  </div>
  <div class="info-row">
    <span class="info-label">实时数据</span>
    <span class="info-value" id="satDate">加载中...</span>
  </div>
  <div class="info-row">
    <span class="info-label">北京时间</span>
    <span class="info-value" id="bjTime">--</span>
  </div>
  <div class="info-row">
    <span class="info-label">UTC时间</span>
    <span class="info-value" id="utcTime">--</span>
  </div>

  <!-- 卫星云图叠加 -->
  <div class="satellite-section">
    <div class="section-label">🛰️ 实时卫星云图叠加</div>
    <div class="toggle-row">
      <span class="toggle-label">🌍 真彩色影像</span>
      <label class="toggle-switch">
        <input type="checkbox" id="satTrueColorToggle" checked onchange="toggleSatLayer('trueColor')">
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="opacity-section">
      <label>不透明度: <span id="satTrueColorOpacityVal">65</span>%</label>
      <input type="range" class="opacity-slider" id="satTrueColorOpacity" min="10" max="100" value="65" oninput="updateSatOpacity('trueColor', this.value)">
    </div>
    <div class="toggle-row">
      <span class="toggle-label">🔴 红外亮温 (云检测)</span>
      <label class="toggle-switch">
        <input type="checkbox" id="satIRToggle" onchange="toggleSatLayer('ir')">
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="opacity-section">
      <label>不透明度: <span id="satIROpacityVal">40</span>%</label>
      <input type="range" class="opacity-slider" id="satIROpacity" min="10" max="100" value="40" oninput="updateSatOpacity('ir', this.value)">
    </div>
    <button class="calc-btn" id="satRefreshBtn" onclick="refreshSatellite()" style="border-color:rgba(59,130,246,0.3);background:rgba(59,130,246,0.1);color:#60a5fa;margin-top:8px">
      <span>🔄</span><span>刷新卫星云图</span>
    </button>
  </div>

  <!-- GK2A 实时卫星云图 -->
  <div class="satellite-section" style="border-top:1px solid rgba(255,255,255,0.1)">
    <div class="section-label">🛰️ GK2A 东亚区域云图 (每2分钟更新)</div>
    <div class="toggle-row">
      <span class="toggle-label">显示 GK2A 东亚云图</span>
      <label class="toggle-switch">
        <input type="checkbox" id="gk2aToggle" checked onchange="toggleGk2a()">
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="opacity-section">
      <label>不透明度: <span id="gk2aOpacityVal">70</span>%</label>
      <input type="range" class="opacity-slider" id="gk2aOpacity" min="10" max="100" value="70" oninput="updateGk2aOpacity(this.value)">
    </div>
    <div class="info-row" style="margin-top:4px">
      <span class="info-label">数据时间</span>
      <span class="info-value" id="gk2aTime">加载中...</span>
    </div>
    <div class="info-row">
      <span class="info-label">下次刷新</span>
      <span class="info-value" id="gk2aNextRefresh">--</span>
    </div>
    <div class="section-label" style="margin-top:8px">卫星产品</div>
    <div class="product-grid" id="gk2aProductGrid">
      <button class="product-btn active" data-pid="geocolor" onclick="switchGk2aProduct('geocolor', this)">
        <div class="product-icon" style="background:rgba(34,197,94,0.2)">🌍</div>
        <span>真彩色</span>
      </button>
      <button class="product-btn" data-pid="band_13" onclick="switchGk2aProduct('band_13', this)">
        <div class="product-icon" style="background:rgba(239,68,68,0.2)">🔴</div>
        <span>红外亮温</span>
      </button>
      <button class="product-btn" data-pid="band_02" onclick="switchGk2aProduct('band_02', this)">
        <div class="product-icon" style="background:rgba(250,204,21,0.2)">☀️</div>
        <span>可见光</span>
      </button>
      <button class="product-btn" data-pid="band_08" onclick="switchGk2aProduct('band_08', this)">
        <div class="product-icon" style="background:rgba(56,189,248,0.2)">💧</div>
        <span>水汽</span>
      </button>
      <button class="product-btn" data-pid="jma_day_cloud_phase_distinction_rgb" onclick="switchGk2aProduct('jma_day_cloud_phase_distinction_rgb', this)">
        <div class="product-icon" style="background:rgba(168,85,247,0.2)">🟣</div>
        <span>云顶增强</span>
      </button>
      <button class="product-btn" data-pid="eumetsat_nighttime_microphysics" onclick="switchGk2aProduct('eumetsat_nighttime_microphysics', this)">
        <div class="product-icon" style="background:rgba(99,102,241,0.2)">🌙</div>
        <span>夜间云</span>
      </button>
    </div>
    <button class="calc-btn" id="gk2aRefreshBtn" onclick="refreshGk2a()" style="border-color:rgba(59,130,246,0.3);background:rgba(59,130,246,0.1);color:#60a5fa;margin-top:8px">
      <span>🔄</span><span>刷新 GK2A 东亚云图</span>
    </button>
  </div>

  <!-- 火烧云 -->
  <div class="fire-cloud-section">
    <div class="section-label">🌅 朝霞 / 晚霞 分析</div>
    <div class="toggle-row">
      <span class="toggle-label" style="color:#fbbf24">显示朝霞晚霞范围</span>
      <label class="toggle-switch">
        <input type="checkbox" id="fireCloudToggle" onchange="toggleFireCloud()">
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="opacity-section">
      <label>覆盖不透明度: <span id="fcOpacityVal">50</span>%</label>
      <input type="range" class="opacity-slider" id="fcOpacity" min="10" max="100" value="50" oninput="updateFireCloudOpacity(this.value)">
    </div>
    <button class="calc-btn" id="fcCalcBtn" onclick="calculateFireCloud()">
      <span>🌅</span><span>计算朝霞晚霞范围</span>
    </button>
    <div style="margin-top:6px">
      <label style="font-size:10px;color:#94a3b8;">模拟时间 (UTC):</label>
      <div class="sim-btns">
        <button class="sim-btn morning active" onclick="simCalc(20.8)">04:48 朝霞</button>
        <button class="sim-btn morning" onclick="simCalc(21.0)">05:00 朝霞</button>
        <button class="sim-btn evening" onclick="simCalc(11.0)">19:00 晚霞</button>
        <button class="sim-btn evening" onclick="simCalc(11.5)">19:30 晚霞</button>
        <button class="sim-btn now" onclick="simCalc(-1)">实际时间</button>
      </div>
    </div>
    <div class="fire-cloud-info" id="fireCloudInfo"></div>
    <div class="fire-cloud-legend" id="fireCloudLegend">
      <div class="legend-title">朝霞 / 晚霞 强度</div>
      <div class="fire-cloud-bar">
        <div class="bar-morning"></div>
        <div class="bar-evening"></div>
      </div>
      <div class="fire-cloud-labels">
        <span class="morning-label">← 朝霞 (日出前)</span>
        <span style="color:#64748b">低</span>
        <span class="evening-label">晚霞 (日落后) →</span>
      </div>
    </div>
  </div>

  <!-- 底图 -->
  <div class="basemap-section">
    <div class="toggle-label" style="margin-bottom:6px;font-size:11px">底图切换</div>
    <div class="basemap-btns">
      <button class="basemap-btn active" onclick="switchBase('sat', this)">卫星</button>
      <button class="basemap-btn" onclick="switchBase('std', this)">标准</button>
      <button class="basemap-btn" onclick="switchBase('dark', this)">暗色</button>
    </div>
  </div>
</div>

<div class="coord-display" id="coordDisplay">--.--N, --.--E</div>
<div class="toast" id="toast"></div>
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <span>计算火烧云...</span>
</div>

<script>
// ===== 火烧云计算引擎 (JavaScript) =====
const R_EARTH = 6371.0;
const AEROSOL_EQ_GROUND = 0.5;
const GRID_STEP = 0.5;
const LAT_MIN = 5, LAT_MAX = 55, LON_MIN = 70, LON_MAX = 145;

function solarDeclination(doy) {
  return 23.45 * Math.sin(Math.PI / 180 * (360 / 365 * (doy - 81)));
}

function solarNoonUtc(lon) {
  return 12.0 - lon / 15.0;
}

function sunsetHourAngle(lat, dec) {
  const latR = lat * Math.PI / 180;
  const decR = dec * Math.PI / 180;
  const cosHA = (-Math.sin(-0.833 * Math.PI / 180) - Math.sin(latR) * Math.sin(decR)) /
                (Math.cos(latR) * Math.cos(decR));
  if (cosHA < -1) return 0;
  if (cosHA > 1) return Math.PI;
  return Math.acos(cosHA);
}

function sunsetTimeUtc(lat, lon, dec) {
  const ha = sunsetHourAngle(lat, dec);
  return solarNoonUtc(lon) + ha * 180 / Math.PI / 15.0;
}

function sunriseTimeUtc(lat, lon, dec) {
  const ha = sunsetHourAngle(lat, dec);
  return solarNoonUtc(lon) - ha * 180 / Math.PI / 15.0;
}

function sunsetLineSpeed(lat, month) {
  const latFactor = Math.max(0.3, Math.cos(lat * Math.PI / 180));
  const monthAngle = Math.PI / 180 * (360 / 365 * (month * 30 - 81));
  const seasonal = 0.8 + 0.2 * Math.cos(monthAngle);
  return 21.0 * latFactor * seasonal;
}

function glowPenetration(cloudBaseKm) {
  return Math.sqrt(2 * R_EARTH * cloudBaseKm);
}

function effectiveCloudBase(h) {
  return Math.max(0.1, h - AEROSOL_EQ_GROUND);
}

function solarAzimuth(lat, dec, hourUtc, lon) {
  const latR = lat * Math.PI / 180;
  const decR = dec * Math.PI / 180;
  const noon = solarNoonUtc(lon);
  const haDeg = (hourUtc - noon) * 15.0;
  const haR = haDeg * Math.PI / 180;
  const sinAlt = Math.sin(latR) * Math.sin(decR) + Math.cos(latR) * Math.cos(decR) * Math.cos(haR);
  const altR = Math.asin(Math.max(-1, Math.min(1, sinAlt)));
  if (Math.cos(altR) < 1e-10) return 180;
  let cosAz = (Math.sin(decR) - Math.sin(latR) * Math.sin(altR)) / (Math.cos(latR) * Math.cos(altR));
  cosAz = Math.max(-1, Math.min(1, cosAz));
  let az = Math.acos(cosAz) * 180 / Math.PI;
  if (haR > 0) az = 360 - az;
  return az;
}

function gridCloudBase(lat, lon) {
  const seed = Math.sin(lat * 127.1 + lon * 311.7) * 43758.5453;
  const rand = seed - Math.floor(seed);
  const absLat = Math.abs(lat);
  let baseMin, baseMax;
  if (absLat < 20) { baseMin = 1.5; baseMax = 5.5; }
  else if (absLat < 35) { baseMin = 1.0; baseMax = 5.0; }
  else if (absLat < 45) { baseMin = 0.8; baseMax = 4.5; }
  else { baseMin = 0.5; baseMax = 3.5; }
  return baseMin + rand * (baseMax - baseMin);
}

function computeFireCloud(utcHour, now) {
  const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
  const dec = solarDeclination(dayOfYear);
  const month = now.getMonth() + 1;

  const lats = [];
  const lons = [];
  for (let lat = LAT_MIN; lat <= LAT_MAX; lat += GRID_STEP) lats.push(lat);
  for (let lon = LON_MIN; lon <= LON_MAX; lon += GRID_STEP) lons.push(lon);

  const features = [];
  let morningCount = 0, eveningCount = 0;

  for (let i = 0; i < lats.length; i++) {
    for (let j = 0; j < lons.length; j++) {
      const lat = lats[i];
      const lon = lons[j];

      const h = gridCloudBase(lat, lon);
      if (h < 0.5) continue;

      const hEff = effectiveCloudBase(h);
      const D = glowPenetration(hEff);

      let ssUtc = sunsetTimeUtc(lat, lon, dec);
      let srUtc = sunriseTimeUtc(lat, lon, dec);

      while (ssUtc < 0) ssUtc += 24;
      while (srUtc < 0) srUtc += 24;
      const effHour = ((utcHour % 24) + 24) % 24;
      while (srUtc < effHour - 12) srUtc += 24;
      while (ssUtc < effHour - 12) ssUtc += 24;

      const vSS = sunsetLineSpeed(lat, month);
      const fireDuration = 2.0 * D / vSS;

      const dtSS = (effHour - ssUtc) * 60;
      const dtSR = (effHour - srUtc) * 60;

      let isMorning = false, isEvening = false, score = 0, sunAz = 0;

      if (dtSR < 0) {
        const dtBefore = Math.abs(dtSR);
        if (dtBefore <= fireDuration + 5) {
          isMorning = true;
          const progress = dtBefore / fireDuration;
          score = Math.max(0, 1.0 - Math.abs(progress - 0.3) * 1.5);
          sunAz = solarAzimuth(lat, dec, srUtc, lon);
        }
      }

      if (!isMorning && dtSS >= 0) {
        if (dtSS <= fireDuration + 5) {
          isEvening = true;
          const progress = dtSS / fireDuration;
          score = Math.max(0, 1.0 - Math.abs(progress - 0.3) * 1.5);
          sunAz = solarAzimuth(lat, dec, ssUtc, lon);
        }
      }

      if (!isMorning && !isEvening) continue;

      if (isMorning) morningCount++;
      else eveningCount++;

      const half = GRID_STEP / 2;
      features.push({
        type: 'Feature',
        properties: {
          cloud_base_km: Math.round(h * 10) / 10,
          eff_cloud_base_km: Math.round(hEff * 10) / 10,
          penetration_km: Math.round(D * 10) / 10,
          fire_duration_min: Math.round(fireDuration * 10) / 10,
          is_morning: isMorning,
          is_evening: isEvening,
          score: Math.round(score * 100) / 100,
          sun_azimuth: Math.round(sunAz * 10) / 10,
        },
        geometry: {
          type: 'Polygon',
          coordinates: [[
            [lon - half, lat - half],
            [lon + half, lat - half],
            [lon + half, lat + half],
            [lon - half, lat + half],
            [lon - half, lat - half],
          ]]
        }
      });
    }
  }

  const simH = Math.floor(((utcHour % 24) + 24) % 24);
  const simM = Math.floor((utcHour - Math.floor(utcHour)) * 60);
  const bjH = (simH + 8) % 24;

  return {
    type: 'FeatureCollection',
    features: features.slice(0, 8000),
    meta: {
      current_utc: `${String(simH).padStart(2,'0')}:${String(simM).padStart(2,'0')} UTC`,
      current_beijing: `${String(bjH).padStart(2,'0')}:${String(simM).padStart(2,'0')}`,
      day_of_year: dayOfYear,
      declination: Math.round(dec * 100) / 100,
      has_fire_cloud: features.length > 0,
      feature_count: features.length,
      morning_count: morningCount,
      evening_count: eveningCount,
      simulated: utcHour >= 0,
    }
  };
}

// ===== 卫星云图叠加层 (NASA GIBS) =====
// GIBS 提供全球近实时卫星影像, 免费无 API Key
// 数据延迟约 3-6 小时, 使用当前日期前12小时确保数据可用

function getGibsDate() {
  const now = new Date();
  // 使用12小时前的日期, 确保 GIBS 数据已生成
  now.setHours(now.getHours() - 12);
  return now.toISOString().slice(0, 10);
}

function createGibsLayer(layerName) {
  const date = getGibsDate();
  // VIIRS 真彩色/红外数据最高支持 Level 9 (250m分辨率)
  // 使用 Level 9 作为 maxNativeZoom，Leaflet 会在更高 zoom 时自动拉伸瓦片
  const tileMatrixSet = 'GoogleMapsCompatible_Level9';
  return L.tileLayer(
    `https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/${layerName}/default/${date}/${tileMatrixSet}/{z}/{y}/{x}.png`,
    {
      maxZoom: 14,
      maxNativeZoom: 9,
      minZoom: 1,
      opacity: 0.65,
      attribution: 'NASA GIBS/VIIRS',
      errorTileUrl: '',
      tileSize: 512,
    }
  );
}

// ===== GK2A ELA 区域卫星云图 (via CIRA SLIDER, 每2分钟更新, 仅覆盖中国及东亚) =====
const GK2A_SECTOR = 'ela'; // 使用 Extended Local Area 区域扇区, 仅覆盖东亚/中国
const GK2A_PRODUCTS = {
  geocolor: { name: '真彩色', product: 'geocolor', desc: 'GeoColor 真彩色合成' },
  band_13: { name: '红外亮温', product: 'band_13', desc: 'Band 13 IR (10.5μm)' },
  band_02: { name: '可见光', product: 'band_02', desc: 'Band 02 可见光 (0.51μm)' },
  band_08: { name: '水汽', product: 'band_08', desc: 'Band 08 水汽 (6.9μm)' },
  jma_day_cloud_phase_distinction_rgb: { name: '云顶增强', product: 'jma_day_cloud_phase_distinction_rgb', desc: 'JMA 云相态区分 RGB' },
  eumetsat_nighttime_microphysics: { name: '夜间云', product: 'eumetsat_nighttime_microphysics', desc: 'EUMETSAT 夜间微物理 RGB' },
};

// GK2A ELA 区域扇区地理边界 (覆盖中国及东亚: 约 5°N-55°N, 65°E-160°E)
const GK2A_BOUNDS = [[5, 65], [55, 160]];

let gk2aCurrentProduct = 'geocolor';
let gk2aLayer = null;
let gk2aTimestamp = null;
let gk2aTimestampStr = null;
let gk2aRefreshTimer = null;
let gk2aCountdownTimer = null;
let gk2aNextRefreshTime = null;
const GK2A_REFRESH_INTERVAL = 2 * 60 * 1000; // ELA 每2分钟更新

// CORS 代理列表 (用于获取时间戳JSON)
const CORS_PROXIES = [
  (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
];

// 带超时的 fetch
function fetchWithTimeout(url, timeoutMs = 8000) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('timeout')), timeoutMs);
    fetch(url).then(r => { clearTimeout(timer); resolve(r); }).catch(e => { clearTimeout(timer); reject(e); });
  });
}

async function fetchGk2aTimestamp(product) {
  const url = `https://slider.cira.colostate.edu/data/json/gk2a/${GK2A_SECTOR}/${product}/latest_times.json`;
  for (const proxyFn of CORS_PROXIES) {
    try {
      const proxyUrl = proxyFn(url);
      const resp = await fetchWithTimeout(proxyUrl, 6000);
      if (!resp.ok) continue;
      const data = await resp.json();
      const timestamps = data.timestamps_int || [];
      if (timestamps.length > 0) {
        console.log(`[GK2A] 通过代理获取时间戳: ${timestamps[0]}`);
        return String(timestamps[0]);
      }
    } catch (e) {
      continue;
    }
  }
  // 回退: 直接尝试 (可能被 CORS 阻止)
  try {
    const resp = await fetchWithTimeout(url, 4000);
    if (resp.ok) {
      const data = await resp.json();
      const timestamps = data.timestamps_int || [];
      if (timestamps.length > 0) {
        console.log(`[GK2A] 直接获取时间戳: ${timestamps[0]}`);
        return String(timestamps[0]);
      }
    }
  } catch (e) {}
  return null;
}

// 时间估算回退: 基于当前时间估算最新可用时间戳
// ELA 每2分钟更新，处理延迟约5分钟
function estimateGk2aTimestamp() {
  const now = new Date();
  // 减去5分钟处理延迟
  now.setMinutes(now.getMinutes() - 5);
  // 向下取整到最近的2分钟
  const mins = now.getMinutes();
  now.setMinutes(Math.floor(mins / 2) * 2, 0, 0);
  // 格式: YYYYMMDDHHMM
  const y = now.getUTCFullYear();
  const m = String(now.getUTCMonth() + 1).padStart(2, '0');
  const d = String(now.getUTCDate()).padStart(2, '0');
  const h = String(now.getUTCHours()).padStart(2, '0');
  const mi = String(now.getUTCMinutes()).padStart(2, '0');
  const ts = `${y}${m}${d}${h}${mi}`;
  console.log(`[GK2A] 估算时间戳: ${ts}`);
  return ts;
}

// GK2A ELA 瓦片拼接: 每张瓦片 688x688, zoom 0=1张, zoom 1=4张(1376x1376), zoom 2=16张(2752x2752)
// ELA 区域扇区仅覆盖东亚, 比全圆盘更高效且分辨率更高
const GK2A_TILE_SIZE = 688;

function getGk2aTileUrl(product, timestamp, row, col, zoomLevel) {
  const y = timestamp.slice(0, 4);
  const m = timestamp.slice(4, 6);
  const d = timestamp.slice(6, 8);
  const zs = String(zoomLevel).padStart(2, '0');
  const rs = String(row).padStart(3, '0');
  const cs = String(col).padStart(3, '0');
  return `https://slider.cira.colostate.edu/data/imagery/${y}/${m}/${d}/gk2a---${GK2A_SECTOR}/${product}/${timestamp}/${zs}/${rs}_${cs}.png`;
}

// 下载单张瓦片 (支持 CORS 代理回退)
function downloadGk2aTile(url, useProxy = false) {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => {
      // 如果直接下载失败且未使用代理，尝试通过 CORS 代理
      if (!useProxy) {
        console.log('[GK2A] 直接下载失败，尝试 CORS 代理:', url.substring(0, 80));
        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
        downloadGk2aTile(proxyUrl, true).then(resolve);
      } else {
        resolve(null);
      }
    };
    img.src = url;
    // 8秒超时
    setTimeout(() => { if (!img.complete) resolve(null); }, 8000);
  });
}

// 拼接所有瓦片为高分辨率全圆盘图像
async function stitchGk2aTiles(product, timestamp, zoomLevel) {
  const grid = 2 ** zoomLevel; // zoom 2 = 4x4, zoom 1 = 2x2
  const tileSize = 688;
  const totalW = grid * tileSize;
  const totalH = grid * tileSize;

  const canvas = document.createElement('canvas');
  canvas.width = totalW;
  canvas.height = totalH;
  const ctx = canvas.getContext('2d');

  // 黑色背景
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, totalW, totalH);

  // 并行下载所有瓦片
  const promises = [];
  for (let row = 0; row < grid; row++) {
    for (let col = 0; col < grid; col++) {
      const url = getGk2aTileUrl(product, timestamp, row, col, zoomLevel);
      promises.push(
        downloadGk2aTile(url).then(img => ({ row, col, img }))
      );
    }
  }

  const results = await Promise.all(promises);
  let loadedCount = 0;
  for (const { row, col, img } of results) {
    if (img) {
      try {
        ctx.drawImage(img, col * tileSize, row * tileSize);
        loadedCount++;
      } catch (e) {
        // canvas 被污染 (CORS 问题)，跳过此瓦片
        console.warn('[GK2A] 瓦片绘制失败 (CORS 污染):', e.message);
      }
    }
  }
  console.log(`[GK2A] 拼接完成 (zoom ${zoomLevel}): ${loadedCount}/${results.length} 瓦片, 分辨率 ${totalW}x${totalH}`);

  // 如果加载的瓦片太少，返回 null
  if (loadedCount < results.length * 0.3) return null;

  // 尝试导出为 data URL (如果 canvas 被污染会抛出异常)
  try {
    return canvas.toDataURL('image/png');
  } catch (e) {
    console.warn('[GK2A] toDataURL 失败 (canvas 被污染):', e.message);
    return null;
  }
}

function getGk2aImageUrl(product, timestamp) {
  // 回退用: 低分辨率单瓦片
  const y = timestamp.slice(0, 4);
  const m = timestamp.slice(4, 6);
  const d = timestamp.slice(6, 8);
  return `https://slider.cira.colostate.edu/data/imagery/${y}/${m}/${d}/gk2a---${GK2A_SECTOR}/${product}/${timestamp}/00/000_000.png`;
}

function formatGk2aTime(ts) {
  if (!ts || ts.length < 12) return '--';
  const y = ts.slice(0, 4), mo = ts.slice(4, 6), d = ts.slice(6, 8);
  const h = ts.slice(8, 10), mi = ts.slice(10, 12);
  const bjH = (parseInt(h) + 8) % 24;
  return `${y}-${mo}-${d} ${h}:${mi} UTC / ${String(bjH).padStart(2,'0')}:${mi} 北京`;
}

async function loadGk2aLayer(product, btn) {
  if (btn) {
    btn.classList.add('loading');
  }
  document.getElementById('gk2aTime').textContent = '获取中...';

  const prod = GK2A_PRODUCTS[product];
  if (!prod) return;

  let ts = await fetchGk2aTimestamp(prod.product);
  let sourceLabel = '';
  if (!ts) {
    // 回退: 使用时间估算
    ts = estimateGk2aTimestamp();
    sourceLabel = ' (估算)';
    console.log('[GK2A] 使用估算时间戳回退');
  }

  gk2aTimestamp = ts;
  gk2aTimestampStr = formatGk2aTime(ts);
  document.getElementById('gk2aTime').textContent = gk2aTimestampStr + sourceLabel;

  // 尝试拼接高分辨率瓦片: 先试 zoom 2 (4x4=16张, 2752x2752), 不行试 zoom 1 (2x2=4张, 1376x1376)
  let imgUrl = null;
  let usedZoom = 0;
  for (const tryZoom of [2, 1]) {
    imgUrl = await stitchGk2aTiles(prod.product, ts, tryZoom);
    if (imgUrl) {
      usedZoom = tryZoom;
      console.log(`[GK2A] 使用 zoom ${tryZoom} 高分辨率拼接图像`);
      break;
    }
    console.log(`[GK2A] zoom ${tryZoom} 拼接失败, 尝试下一级别`);
  }
  if (!imgUrl) {
    // 最终回退: 低分辨率单瓦片 (zoom 0, 688x688)
    console.log('[GK2A] 所有拼接失败, 回退到低分辨率单瓦片');
    imgUrl = getGk2aImageUrl(prod.product, ts);
    sourceLabel = sourceLabel || ' (低分辨率)';
  } else {
    sourceLabel = sourceLabel || ` (${usedZoom === 2 ? '高' : '中'}分辨率)`;
  }

  // 移除旧图层
  if (gk2aLayer) {
    map.removeLayer(gk2aLayer);
    gk2aLayer = null;
  }

  // 创建新图层
  gk2aLayer = L.imageOverlay(imgUrl, GK2A_BOUNDS, {
    opacity: document.getElementById('gk2aOpacity').value / 100,
    attribution: `GK2A / CIRA SLIDER`,
    className: 'gk2a-overlay',
    errorOverlayUrl: '',
  });

  if (document.getElementById('gk2aToggle').checked) {
    gk2aLayer.addTo(map);
  }

  // 更新产品按钮状态
  document.querySelectorAll('#gk2aProductGrid .product-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  else {
    const activeBtn = document.querySelector(`#gk2aProductGrid .product-btn[data-pid="${product}"]`);
    if (activeBtn) activeBtn.classList.add('active');
  }

  gk2aCurrentProduct = product;

  // 更新卫星信息
  document.getElementById('satDate').textContent = gk2aTimestampStr;

  if (btn) btn.classList.remove('loading');
  showToast(`GK2A ${prod.name} 加载完成: ${gk2aTimestampStr}`);

  // 安排下次自动刷新
  scheduleGk2aRefresh();
}

function scheduleGk2aRefresh() {
  if (gk2aRefreshTimer) clearTimeout(gk2aRefreshTimer);
  if (gk2aCountdownTimer) clearInterval(gk2aCountdownTimer);
  gk2aNextRefreshTime = Date.now() + GK2A_REFRESH_INTERVAL;

  gk2aRefreshTimer = setTimeout(() => {
    loadGk2aLayer(gk2aCurrentProduct);
  }, GK2A_REFRESH_INTERVAL);

  gk2aCountdownTimer = setInterval(() => {
    const remaining = gk2aNextRefreshTime - Date.now();
    if (remaining <= 0) {
      document.getElementById('gk2aNextRefresh').textContent = '刷新中...';
      clearInterval(gk2aCountdownTimer);
    } else {
      const min = Math.floor(remaining / 60000);
      const sec = Math.floor((remaining % 60000) / 1000);
      document.getElementById('gk2aNextRefresh').textContent = `${min}分${sec}秒`;
    }
  }, 1000);
}

async function switchGk2aProduct(pid, btn) {
  if (pid === gk2aCurrentProduct) return;
  await loadGk2aLayer(pid, btn);
}

async function refreshGk2a() {
  const btn = document.getElementById('gk2aRefreshBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner" style="width:12px;height:12px;border-color:rgba(96,165,250,0.3);border-top-color:#60a5fa"></span><span>刷新中...</span>';
  await loadGk2aLayer(gk2aCurrentProduct);
  btn.disabled = false;
  btn.innerHTML = '<span>🔄</span><span>刷新 GK2A 东亚云图</span>';
}

function toggleGk2a() {
  const checked = document.getElementById('gk2aToggle').checked;
  if (checked && gk2aLayer) {
    gk2aLayer.addTo(map);
  } else if (gk2aLayer) {
    map.removeLayer(gk2aLayer);
  }
}

function updateGk2aOpacity(val) {
  document.getElementById('gk2aOpacityVal').textContent = val;
  if (gk2aLayer) {
    gk2aLayer.setOpacity(val / 100);
  }
}

// ===== 火烧云图层 =====
let fireCloudLayer = null;
let fireCloudData = null;
let simulateHour = 20.8;

function getFireCloudColor(props) {
  const score = props.score || 0;
  const h = props.cloud_base_km || 2;
  const isEvening = props.is_evening;
  const isMorning = props.is_morning;
  let r, g, b, a;

  if (isMorning) {
    if (score < 0.3) { r = 255; g = 180; b = 80; }
    else if (score < 0.6) { r = 255; g = 140; b = 60; }
    else { r = 255; g = 100; b = 40; }
    if (h > 8) { r = Math.min(255, r); g = Math.max(60, g - 60); b = Math.min(255, b + 80); }
    if (h < 3) { r = 255; g = Math.min(220, g + 40); b = Math.max(40, b - 20); }
  } else {
    if (score < 0.3) { r = 180; g = 60; b = 120; }
    else if (score < 0.6) { r = 220; g = 50; b = 80; }
    else { r = 200; g = 30; b = 30; }
    if (h > 8) { r = Math.min(255, r + 30); g = Math.max(20, g - 20); b = Math.min(255, b + 60); }
    if (h < 3) { r = Math.min(255, r + 20); g = Math.min(100, g + 30); b = Math.max(30, b - 40); }
  }
  a = 0.15 + score * 0.5;
  return `rgba(${r},${g},${b},${a.toFixed(2)})`;
}

function fireCloudStyle(feature) {
  return {
    fillColor: getFireCloudColor(feature.properties),
    color: feature.properties.is_morning ? 'rgba(255,180,80,0.4)' : 'rgba(220,50,80,0.4)',
    weight: 0.5,
    fillOpacity: 1,
  };
}

function fireCloudPopup(feature, layer) {
  const p = feature.properties;
  const type = p.is_morning ? '🌅 朝霞' : '🌇 晚霞';
  const azLabel = p.is_morning ? '日出方位' : '日落方位';
  const az = p.sun_azimuth || 0;
  const azDir = az >= 337.5 || az < 22.5 ? '北' : az >= 22.5 && az < 67.5 ? '东北' : az >= 67.5 && az < 112.5 ? '东' : az >= 112.5 && az < 157.5 ? '东南' : az >= 157.5 && az < 202.5 ? '南' : az >= 202.5 && az < 247.5 ? '西南' : az >= 247.5 && az < 292.5 ? '西' : '西北';
  return `
    <div style="font-size:12px;line-height:1.8;min-width:200px">
      <div style="font-weight:700;font-size:14px;color:${p.is_morning ? '#d97706' : '#dc2626'};margin-bottom:4px">${type}</div>
      <div>云底高度: <b>${p.cloud_base_km} km</b></div>
      <div>等效云底: <b>${p.eff_cloud_base_km} km</b></div>
      <div>霞光深入距离: <b>${p.penetration_km} km</b></div>
      <div>预计持续: <b>${p.fire_duration_min} 分钟</b></div>
      <div>${azLabel}: <b>${az}° (${azDir})</b></div>
      <div>概率评分: <b>${(p.score * 100).toFixed(0)}%</b></div>
      <div style="margin-top:4px;font-size:10px;color:#94a3b8;border-top:1px solid rgba(255,255,255,0.1);padding-top:4px">
        D=√(2Rh) | T≈2D/v_sunset
      </div>
    </div>`;
}

function onEachFireCloudFeature(feature, layer) {
  layer.bindPopup(fireCloudPopup(feature, layer), {maxWidth: 250});
  layer.on('mouseover', function(e) {
    e.target.setStyle({weight: 2, color: 'rgba(255,200,0,0.8)'});
  });
  layer.on('mouseout', function(e) {
    fireCloudLayer.resetStyle(e.target);
  });
}

function calculateFireCloud() {
  const btn = document.getElementById('fcCalcBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner" style="width:12px;height:12px;border-color:rgba(251,146,60,0.3);border-top-color:#fb923c"></span><span>计算中...</span>';
  document.getElementById('statusBadge').className = 'status-badge loading';
  document.getElementById('statusText').textContent = '计算中';

  const overlay = document.getElementById('loadingOverlay');
  overlay.classList.add('show');

  setTimeout(() => {
    const now = new Date();
    let utcHour;
    if (simulateHour < 0 || simulateHour === null) {
      utcHour = now.getUTCHours() + now.getUTCMinutes() / 60 + now.getUTCSeconds() / 3600;
    } else {
      utcHour = simulateHour;
    }

    const geojson = computeFireCloud(utcHour, now);
    fireCloudData = geojson;
    const meta = geojson.meta || {};

    updateFireCloudInfo(meta);

    if (meta.has_fire_cloud && geojson.features.length > 0) {
      if (fireCloudLayer) { map.removeLayer(fireCloudLayer); }

      fireCloudLayer = L.geoJSON(geojson, {
        style: fireCloudStyle,
        onEachFeature: onEachFireCloudFeature,
      });

      const opacity = document.getElementById('fcOpacity').value / 100;
      fireCloudLayer.setStyle({ fillOpacity: opacity });

      if (document.getElementById('fireCloudToggle').checked) {
        fireCloudLayer.addTo(map);
      }

      document.getElementById('fireCloudLegend').style.display = 'block';
      document.getElementById('statusBadge').className = 'status-badge live';
      document.getElementById('statusText').textContent = '有火烧云';
      showToast(`分析完成: ${meta.feature_count} 个区域 (${meta.morning_count || 0}朝霞, ${meta.evening_count || 0}晚霞)`);
    } else {
      if (fireCloudLayer) { map.removeLayer(fireCloudLayer); fireCloudLayer = null; }
      document.getElementById('fireCloudLegend').style.display = 'none';
      document.getElementById('statusBadge').className = 'status-badge no';
      document.getElementById('statusText').textContent = '无火烧云';
      showToast('当前时间无朝霞/晚霞');
    }

    overlay.classList.remove('show');
    btn.disabled = false;
    btn.innerHTML = '<span>🌅</span><span>计算朝霞晚霞范围</span>';
  }, 150);
}

function toggleFireCloud() {
  const checked = document.getElementById('fireCloudToggle').checked;
  if (checked && fireCloudLayer) {
    fireCloudLayer.addTo(map);
  } else if (fireCloudLayer) {
    map.removeLayer(fireCloudLayer);
  }
}

function updateFireCloudOpacity(val) {
  document.getElementById('fcOpacityVal').textContent = val;
  if (fireCloudLayer) {
    fireCloudLayer.eachLayer(function(layer) {
      const props = layer.feature.properties;
      const baseColor = getFireCloudColor(props);
      const rgbMatch = baseColor.match(/rgba?\((\d+),(\d+),(\d+),([\d.]+)\)/);
      if (rgbMatch) {
        const newAlpha = (val / 100).toFixed(2);
        layer.setStyle({ fillColor: `rgba(${rgbMatch[1]},${rgbMatch[2]},${rgbMatch[3]},${newAlpha})` });
      }
    });
  }
}

function updateFireCloudInfo(meta) {
  const panel = document.getElementById('fireCloudInfo');
  if (!meta.has_fire_cloud) {
    panel.innerHTML = `
      <div style="color:#94a3b8;margin-bottom:4px">当前时间无朝霞/晚霞</div>
      <div>UTC: ${meta.current_utc || '--'}</div>
      <div>北京: ${meta.current_beijing || '--'}</div>
      <div style="margin-top:4px;font-size:10px;color:#64748b">云底数据: 气候估算</div>
    `;
    panel.className = 'fire-cloud-info visible';
    return;
  }

  panel.innerHTML = `
    <div style="color:#fb923c;font-weight:700;margin-bottom:4px">🌅 朝霞 / 晚霞 分析结果</div>
    <div class="info-item"><span>UTC时间</span><span>${meta.current_utc}</span></div>
    <div class="info-item"><span>北京时间</span><span>${meta.current_beijing}</span></div>
    <div class="info-item"><span>云底数据源</span><span style="color:#fbbf24">气候估算</span></div>
    <div class="info-item"><span>总覆盖格点</span><span>${meta.feature_count} 个</span></div>
    <div class="info-item"><span>🌅 朝霞区域</span><span style="color:#fbbf24">${meta.morning_count || 0} 个</span></div>
    <div class="info-item"><span>🌇 晚霞区域</span><span style="color:#f87171">${meta.evening_count || 0} 个</span></div>
    <div class="info-item"><span>太阳赤纬</span><span>${meta.declination}°</span></div>
    <div style="margin-top:4px;font-size:10px;color:#94a3b8;line-height:1.5">
      <div>核心公式:</div>
      <div>• D ≈ √(2·R·h), R=6371km</div>
      <div>• h_eff = h - 0.5km (气溶胶修正)</div>
      <div>• T ≈ 2D/v_sunset</div>
      <div>• v_sunset ≈ 18~21 km/min</div>
    </div>
  `;
  panel.className = 'fire-cloud-info visible';
}

function simCalc(hour) {
  simulateHour = hour < 0 ? null : hour;

  document.querySelectorAll('.sim-btn').forEach(b => b.classList.remove('active'));
  if (hour === 20.8) document.querySelector('.sim-btn.morning').classList.add('active');
  else if (hour === 21.0) document.querySelectorAll('.sim-btn.morning')[1].classList.add('active');
  else if (hour === 11.0) document.querySelector('.sim-btn.evening').classList.add('active');
  else if (hour === 11.5) document.querySelectorAll('.sim-btn.evening')[1].classList.add('active');
  else document.querySelector('.sim-btn.now').classList.add('active');

  const toggle = document.getElementById('fireCloudToggle');
  if (!toggle.checked) toggle.checked = true;

  calculateFireCloud();
}

// ===== 坐标显示 =====
map.on('mousemove', function(e) {
  const lat = e.latlng.lat.toFixed(2);
  const lon = e.latlng.lng.toFixed(2);
  const ns = lat >= 0 ? 'N' : 'S';
  const ew = lon >= 0 ? 'E' : 'W';
  document.getElementById('coordDisplay').textContent =
    `${Math.abs(lat)}${ns}, ${Math.abs(lon)}${ew} | Zoom: ${map.getZoom()}`;
});

// ===== Toast =====
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// ===== 时间更新 =====
function updateTimeDisplay() {
  const now = new Date();
  const bj = new Date(now.getTime() + 8 * 3600000);
  document.getElementById('bjTime').textContent = bj.toISOString().replace('T',' ').slice(0,19);
  document.getElementById('utcTime').textContent = now.toISOString().replace('T',' ').slice(0,19);
}

// ===== 初始化 =====
setTimeout(() => {
  // 加载 GK2A 实时卫星云图
  loadGk2aLayer('geocolor');
  // 计算初始火烧云
  simCalc(20.8);
  updateTimeDisplay();
  setInterval(updateTimeDisplay, 30000);
}, 500);
</script>
